spring.application.name=GestionDePedidos

# --- Base de datos ---
# Las credenciales se leen del archivo .env de la raíz del backend (copia .env.example a .env).
# "optional:" evita fallar si no existe; en ese caso también valen variables de entorno reales.
spring.config.import=optional:file:.env[.properties]

# URL y usuario tienen valor por defecto; la contraseña NO, para no subirla al repositorio.
# Si no hay .env, la contraseña queda vacía y MySQL responde "Access denied for user 'root'".
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/gestion_pedidos?useSSL=false&createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# update: crea y actualiza las tablas a partir de las entidades al arrancar.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
